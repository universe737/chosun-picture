<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조선 후기 민화 탐구 & 창작 스튜디오</title>
    <style>
        :root {
            --primary: #7d1c1c;
            --primary-dark: #581010;
            --secondary: #d4a359;
            --bg-paper: #f4efe6;
            --panel-bg: #ffffff;
            --text-dark: #2c221e;
            --accent: #2e5a44;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--text-dark);
            background-image: radial-gradient(#d3c6b4 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            color: #fff;
            padding: 1.2rem 2rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-bottom: 4px solid var(--secondary);
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        header p {
            font-size: 0.95rem;
            color: #f1d6b8;
            margin-top: 5px;
        }

        .score-board {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--secondary);
        }

        nav {
            display: flex;
            justify-content: center;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            background: none;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background-color: #fcf9f5;
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 1. 학습 & 퀴즈 탭 */
        .study-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
        }

        .artwork-list {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2d8cd;
        }

        .artwork-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0.8rem;
            border: 2px solid transparent;
            transition: all 0.2s;
            background: #fdfbf7;
        }

        .artwork-card:hover, .artwork-card.active {
            border-color: var(--primary);
            background: #f9f2e8;
        }

        .artwork-card img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .artwork-card-info h3 {
            font-size: 1rem;
            color: var(--primary);
        }

        .artwork-card-info p {
            font-size: 0.8rem;
            color: #666;
        }

        .viewer-container {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2d8cd;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .hotspot {
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: rgba(212, 163, 89, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            animation: pulse 1.8s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(212, 163, 89, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 0 10px rgba(212, 163, 89, 0); }
            100% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(212, 163, 89, 0); }
        }

        .info-box {
            background: #fdf8ef;
            border-left: 5px solid var(--secondary);
            padding: 1rem;
            border-radius: 4px;
            min-height: 70px;
        }

        .quiz-section {
            background: #f5ece0;
            padding: 1.2rem;
            border-radius: 8px;
            border: 1px dashed var(--primary);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .quiz-btn {
            padding: 0.8rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            text-align: left;
        }

        .quiz-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 2. 창작 스튜디오 탭 */
        .studio-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
        }

        .controls-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2d8cd;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .wish-input-box {
            display: flex;
            gap: 5px;
        }

        .wish-input-box input {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            padding: 0.6rem 1rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .sticker-palette {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 8px;
            border-radius: 6px;
            background: #fafafa;
        }

        .sticker-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
            transition: transform 0.1s;
        }

        .sticker-item:hover {
            transform: scale(1.05);
            border-color: var(--secondary);
        }

        .sticker-item canvas {
            width: 45px;
            height: 45px;
        }

        .canvas-area {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2d8cd;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #mainCanvas {
            border: 12px solid #583318;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-radius: 4px;
            cursor: crosshair;
            background-color: #f4efe6;
        }

        .canvas-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        /* 풋터 */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #777;
            font-size: 0.85rem;
            border-top: 1px solid #ddd;
            margin-top: 2rem;
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>조선 후기 민화 탐구 & 창작 스튜디오</h1>
        <p>민화 속 사물의 의미를 탐구하고, 나의 소망을 담은 소망 민화를 직접 작성해 보세요!</p>
        <div class="score-board">
            <span>🎁 복주머니 포인트:</span>
            <span id="scoreText">0</span>점
        </div>
    </header>

    <nav>
        <button class="tab-btn active" onclick="switchTab('study')">1. 민화 탐구 & 퀴즈 게임</button>
        <button class="tab-btn" onclick="switchTab('studio')">2. 나만의 소망 민화 만들기</button>
    </nav>

    <main>
        <!-- TAB 1: 민화 탐구 -->
        <div id="studyTab" class="tab-content active">
            <div class="study-grid">
                <div class="artwork-list" id="artworkList">
                    <!-- Dynamic Rendering -->
                </div>
                <div class="viewer-container">
                    <h2 id="artworkTitle">민화를 선택해주세요</h2>
                    <div class="image-wrapper" id="imageWrapper">
                        <img id="mainImage" src="" alt="민화 작품">
                        <div id="hotspotContainer"></div>
                    </div>
                    <div class="info-box" id="infoBox">
                        👉 <strong>민화 속 동그라미 번호</strong>를 클릭해 사물의 의미를 찾아보세요!
                    </div>
                    <div class="quiz-section">
                        <h4 id="quizQuestion">❓ 이 민화 전체가 담고 있는 서민들의 소망은 무엇일까요?</h4>
                        <div class="quiz-options" id="quizOptions">
                            <!-- Dynamic Options -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: 나만의 소망 민화 스튜디오 -->
        <div id="studioTab" class="tab-content">
            <div class="studio-grid">
                <div class="controls-panel">
                    <div class="control-group">
                        <label>1. 나의 소망 입력하기</label>
                        <div class="wish-input-box">
                            <input type="text" id="wishInput" placeholder="예: 시험 잘 보게 해주세요, 건강하기">
                            <button class="btn" onclick="recommendObjects()">추천</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>2. 민화 배경 색상선택</label>
                        <select id="bgColorSelect" onchange="changeBgColor()" style="padding:0.5rem; border-radius:4px; border:1px solid #ccc;">
                            <option value="#f4efe6">기본 한지 색상 (은은한 베이지)</option>
                            <option value="#e8ded1">고풍스러운 고서화색</option>
                            <option value="#e5eee6">청아한 오방색 청(靑) 느낌</option>
                            <option value="#f9ebea">따뜻한 오방색 적(赤) 느낌</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>3. 사물 스티커 선택 (클릭 시 캔버스 배치)</label>
                        <div class="sticker-palette" id="stickerPalette">
                            <!-- Canvas Generated Icons -->
                        </div>
                    </div>

                    <div class="control-group">
                        <label>4. 족자 글귀 (소망 문구)</label>
                        <input type="text" id="canvasText" placeholder="캔버스에 적을 글귀" style="padding:0.5rem; border-radius:4px; border:1px solid #ccc;">
                        <button class="btn" onclick="addTextToCanvas()" style="margin-top:5px; background:var(--accent);">글귀 추가하기</button>
                    </div>

                    <div class="control-group">
                        <button class="btn" onclick="clearCanvas()" style="background:#777;">캔버스 초기화</button>
                    </div>
                </div>

                <div class="canvas-area">
                    <canvas id="mainCanvas" width="600" height="700"></canvas>
                    <div class="canvas-actions">
                        <button class="btn" onclick="downloadCanvas()" style="font-size:1.1rem; padding:0.8rem 2rem; background:var(--primary);">📜 나만의 소망 민화 완성작 저장하기 (PNG)</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>초등학교 5학년 사회과 조선 후기 서민 문화 - 민화 학습 도구 | 문화재청 및 국립중앙박물관 공공 누리/위키미디어 공공 데이터 활용</p>
    </footer>

    <script>
        // 조선후기 실제 민화 이미지 (Wikimedia / 공공누리 공공저작물)
        const artworks = [
            {
                id: 'hojakdo',
                title: '호작도 (호랑이와 까치)',
                period: '조선 후기 (19세기)',
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Minhwa-Hojakdo-01.jpg/600px-Minhwa-Hojakdo-01.jpg',
                description: '조선 후기 서민들이 새해를 맞아 액운을 막고 기쁜 소식을 기원하며 대문에 붙이던 대표적인 민화입니다.',
                hotspots: [
                    { x: 50, y: 55, num: 1, name: '호랑이', meaning: '액운과 나쁜 기운을 물리쳐주는 영험한 영물(신령스러운 동물)을 상징합니다.' },
                    { x: 35, y: 18, num: 2, name: '까치', meaning: '기쁜 소식과 좋은 일(길조)을 전해주는 전령을 상징합니다.' },
                    { x: 75, y: 25, num: 3, name: '소나무', meaning: '새해의 시작과 장수, 변함없는 지조와 절개를 상징합니다.' }
                ],
                quiz: {
                    question: '이 호작도 그림이 담고 있는 조선 시대 서민들의 주요 소망은 무엇일까요?',
                    options: [
                        { text: '나쁜 액운을 막고 기쁜 소식이 찾아오길 바라는 소망', correct: true },
                        { text: '벼슬자리에 올라 부귀영화와 권력을 누리려는 소망', correct: false },
                        { text: '학문에 매진하여 훌륭한 학자가 되려는 소망', correct: false },
                        { text: '자식을 많이 낳아 가문을 번창시키려는 소망', correct: false }
                    ]
                }
            },
            {
                id: 'chaekgeori',
                title: '책거리 (책가도)',
                period: '조선 후기 (18~19세기)',
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Chaekgeori-19th_century.jpg/600px-Chaekgeori-19th_century.jpg',
                description: '책과 여러 가지 문방구, 선비의 물품들을 그린 그림으로 학문 사랑과 출세를 기원했습니다.',
                hotspots: [
                    { x: 48, y: 35, num: 1, name: '쌓인 책들', meaning: '학문에 힘써 깊은 지식을 쌓고 학업을 성취하길 바라는 소망입니다.' },
                    { x: 28, y: 65, num: 2, name: '붓과 먹', meaning: '벼슬길에 올라 출세하고 나라에 이바지하려는 선비의 덕목을 뜻합니다.' },
                    { x: 70, y: 60, num: 3, name: '도자기와 복숭아', meaning: '평안함(도자기)과 장수(복숭아)를 기원하는 고풍스러운 장식물입니다.' }
                ],
                quiz: {
                    question: '책거리(책가도)를 방에 걸어두며 서민과 선비들이 빌었던 염원은 무엇일까요?',
                    options: [
                        { text: '부지런히 학문을 탐구하여 출세하고 지혜로워지기를 기원함', correct: true },
                        { text: '외적의 침입으로부터 나라를 보호하기를 기원함', correct: false },
                        { text: '농사가 풍년이 들기를 기원함', correct: false },
                        { text: '바다로 나간 배가 안전하게 돌아오기를 기원함', correct: false }
                    ]
                }
            },
            {
                id: 'munjado',
                title: '문자도 (효·제·충·신...)',
                period: '조선 후기 (19세기)',
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Munjado-Hyo.jpg/500px-Munjado-Hyo.jpg',

                    { x: 30, y: 70, num: 2, name: '잉어', meaning: '병석의 부모님을 위해 추운 겨울 얼음을 깨고 잉어를 구한 효자 고사에서 나온 상징입니다.' },

                quiz: {

                        { text: '장사를 잘 하여 돈을 많이 버는 방법', correct: false },
                        { text: '무술을 연마하여 싸움에서 이기는 기술', correct: false },
                        { text: '외국어 표현을 빠르게 익히는 요령', correct: false }
                    ]
                }
            },
            {
                id: 'hwajodo',
                title: '화조도 (꽃과 새)',
                period: '조선 후기 (19세기)',
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Korean_Minhwa-Hwajodo.jpg/500px-Korean_Minhwa-Hwajodo.jpg',
                description: '아름다운 꽃과 한 쌍의 새를 그려 가정의 화목과 다정함, 화창한 봄날 같은 행복을 기원했습니다.',
                hotspots: [
                    { x: 45, y: 35, num: 1, name: '한 쌍의 새', meaning: '부부 간의 사랑과 가족 모두가 서로 화목하게 지내는 것을 상징합니다.' },
                    { x: 60, y: 65, num: 2, name: '모란꽃', meaning: '꽃 중의 왕으로 불리며, 부귀영화와 화창한 삶을 상징합니다.' },
                    { x: 25, y: 75, num: 3, name: '바위', meaning: '오랜 세월 변함없는 건강과 영원한 장수를 상징합니다.' }
                ],
                quiz: {
                    question: '화조도(꽃과 새 그림)를 가정에 걸어둠으로써 기대했던 바는 무엇일까요?',
                    options: [
                        { text: '가정이 화목하고 부귀와 행복이 가득하기를 기원함', correct: true },
                        { text: '귀신을 물리치고 엄격한 질서를 세우기를 기원함', correct: false },
                        { text: '비가 많이 내려 가뭄을 해결하기를 기원함', correct: false },
                        { text: '어려운 시험에 일등으로 합격하기만을 기원함', correct: false }
                    ]
                }
            }
        ];

        // 스티커 그래픽 생성용 정의
        const stickerDefs = [
            { id: 'tiger', name: '호랑이', type: 'drawTiger', meaning: '액운 퇴치, 늠름함' },
            { id: 'magpie', name: '까치', type: 'drawMagpie', meaning: '기쁜 소식' },
            { id: 'pine', name: '소나무', type: 'drawPine', meaning: '장수, 절개' },
            { id: 'book', name: '책 stack', type: 'drawBook', meaning: '지혜, 학업 성취' },
            { id: 'peony', name: '모란꽃', type: 'drawPeony', meaning: '부귀, 행복' },
            { id: 'carp', name: '잉어', type: 'drawCarp', meaning: '효도, 등용문' },
            { id: 'sun', name: '해', type: 'drawSun', meaning: '새 출발, 밝은 미래' },
            { id: 'peach', name: '복숭아', type: 'drawPeach', meaning: '무병장수' }
        ];

        let currentArtworkIndex = 0;
        let score = 0;
        let canvasElements = [];
        let canvasBgColor = '#f4efe6';

        // 탭 전환
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'study') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('studyTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('studioTab').classList.add('active');
                renderCanvas();
            }
        }

        // 민화 학습 탭 초기화
        function initStudyTab() {
            const listEl = document.getElementById('artworkList');
            listEl.innerHTML = '';

            artworks.forEach((art, idx) => {
                const card = document.createElement('div');
                card.className = `artwork-card ${idx === 0 ? 'active' : ''}`;
                card.onclick = () => selectArtwork(idx);
                card.innerHTML = `
                    <img src="${art.image}" alt="${art.title}">
                    <div class="artwork-card-info">
                        <h3>${art.title}</h3>
                        <p>${art.period}</p>
                    </div>
                `;
                listEl.appendChild(card);
            });

            selectArtwork(0);
        }

        function selectArtwork(index) {
            currentArtworkIndex = index;
            const art = artworks[index];

            document.querySelectorAll('.artwork-card').forEach((card, idx) => {
                card.classList.toggle('active', idx === index);
            });

            document.getElementById('artworkTitle').innerText = `${art.title} (${art.period})`;
            document.getElementById('mainImage').src = art.image;
            document.getElementById('infoBox').innerHTML = `👉 <strong>${art.title}</strong>: ${art.description}<br><span style="color:#888;">(그림 위 동그라미 번호를 눌러 사물의 의미를 확인하세요)</span>`;

            // Hotspots render
            const container = document.getElementById('hotspotContainer');
            container.innerHTML = '';
            art.hotspots.forEach(hs => {
                const spot = document.createElement('div');
                spot.className = 'hotspot';
                spot.style.left = hs.x + '%';
                spot.style.top = hs.y + '%';
                spot.innerText = hs.num;
                spot.onclick = () => {
                    document.getElementById('infoBox').innerHTML = `
                        <h4 style="color:var(--primary); margin-bottom:4px;">🔍 ${hs.num}번. ${hs.name}</h4>
                        <p style="font-size:0.95rem;">${hs.meaning}</p>
                    `;
                };
                container.appendChild(spot);
            });

            // Quiz render
            document.getElementById('quizQuestion').innerText = `❓ ${art.quiz.question}`;
            const quizOpts = document.getElementById('quizOptions');
            quizOpts.innerHTML = '';
            art.quiz.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkQuiz(opt.correct);
                quizOpts.appendChild(btn);
            });
        }

        function checkQuiz(isCorrect) {
            if (isCorrect) {
                score += 50;
                document.getElementById('scoreText').innerText = score;
                alert('🎉 정답입니다! 조선 시대 서민들의 마음을 잘 이해하셨네요! (+50점 획득)');
            } else {
                alert('💡 다시 한번 생각해보세요! 사물들의 의미(호랑이, 까치, 책 등)를 살펴보면 힌트를 얻을 수 있습니다.');
            }
        }

        // Canvas & Studio 관련
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        function initStudioTab() {
            renderStickerPalette();
            renderCanvas();
        }

        // 개별 사물 아이콘 그리기 함수들 (Canvas Vector Data)
        function drawIcon(type, targetCtx, w, h) {
            targetCtx.clearRect(0, 0, w, h);
            targetCtx.save();

            if(type === 'drawTiger') {
                // 호랑이 얼굴
                targetCtx.fillStyle = '#e69500';
                targetCtx.beginPath(); targetCtx.arc(w/2, h/2, 18, 0, Math.PI*2); targetCtx.fill();
                // 귀
                targetCtx.beginPath(); targetCtx.arc(w/2-14, h/2-14, 6, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.arc(w/2+14, h/2-14, 6, 0, Math.PI*2); targetCtx.fill();
                // 줄무늬
                targetCtx.strokeStyle = '#000'; targetCtx.lineWidth = 2;
                targetCtx.beginPath(); targetCtx.moveTo(w/2-8, h/2-10); targetCtx.lineTo(w/2+8, h/2-10); targetCtx.stroke();
                targetCtx.beginPath(); targetCtx.moveTo(w/2-12, h/2); targetCtx.lineTo(w/2-4, h/2); targetCtx.stroke();
                targetCtx.beginPath(); targetCtx.moveTo(w/2+4, h/2); targetCtx.lineTo(w/2+12, h/2); targetCtx.stroke();
                // 눈
                targetCtx.fillStyle = '#fff';
                targetCtx.beginPath(); targetCtx.arc(w/2-6, h/2-4, 4, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.arc(w/2+6, h/2-4, 4, 0, Math.PI*2); targetCtx.fill();
                targetCtx.fillStyle = '#000';
                targetCtx.beginPath(); targetCtx.arc(w/2-6, h/2-4, 2, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.arc(w/2+6, h/2-4, 2, 0, Math.PI*2); targetCtx.fill();
            } else if(type === 'drawMagpie') {
                // 까치
                targetCtx.fillStyle = '#222';
                targetCtx.beginPath(); targetCtx.ellipse(w/2, h/2+2, 16, 10, Math.PI/4, 0, Math.PI*2); targetCtx.fill();
                targetCtx.fillStyle = '#fff';
                targetCtx.beginPath(); targetCtx.arc(w/2-4, h/2, 6, 0, Math.PI*2); targetCtx.fill();
                targetCtx.fillStyle = '#d4a359';
                targetCtx.beginPath(); targetCtx.moveTo(w/2-14, h/2-2); targetCtx.lineTo(w/2-22, h/2); targetCtx.lineTo(w/2-14, h/2+4); targetCtx.fill();
            } else if(type === 'drawPine') {
                // 소나무
                targetCtx.fillStyle = '#5c4033';
                targetCtx.fillRect(w/2-3, h/2, 6, 18);
                targetCtx.fillStyle = '#2e5a44';
                targetCtx.beginPath(); targetCtx.arc(w/2, h/2-6, 16, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.arc(w/2-10, h/2+2, 12, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.arc(w/2+10, h/2+2, 12, 0, Math.PI*2); targetCtx.fill();
            } else if(type === 'drawBook') {
                // 책
                targetCtx.fillStyle = '#1f4e79';
                targetCtx.fillRect(w/2-16, h/2-12, 32, 22);
                targetCtx.fillStyle = '#fff';
                targetCtx.fillRect(w/2-14, h/2-10, 28, 18);
                targetCtx.fillStyle = '#b83b5e';
                targetCtx.fillRect(w/2-12, h/2-8, 24, 14);
            } else if(type === 'drawPeony') {
                // 모란꽃
                targetCtx.fillStyle = '#c0392b';
                targetCtx.beginPath(); targetCtx.arc(w/2, h/2, 15, 0, Math.PI*2); targetCtx.fill();
                targetCtx.fillStyle = '#e74c3c';
                for(let i=0; i<5; i++) {
                    let ang = (i*72) * Math.PI/180;
                    targetCtx.beginPath(); targetCtx.arc(w/2 + Math.cos(ang)*8, h/2 + Math.sin(ang)*8, 8, 0, Math.PI*2); targetCtx.fill();
                }
                targetCtx.fillStyle = '#f1c40f';
                targetCtx.beginPath(); targetCtx.arc(w/2, h/2, 5, 0, Math.PI*2); targetCtx.fill();
            } else if(type === 'drawCarp') {
                // 잉어
                targetCtx.fillStyle = '#d35400';
                targetCtx.beginPath(); targetCtx.ellipse(w/2, h/2, 18, 10, 0, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.moveTo(w/2+14, h/2); targetCtx.lineTo(w/2+24, h/2-8); targetCtx.lineTo(w/2+24, h/2+8); targetCtx.fill();
            } else if(type === 'drawSun') {
                // 해
                targetCtx.fillStyle = '#c0392b';
                targetCtx.beginPath(); targetCtx.arc(w/2, h/2, 16, 0, Math.PI*2); targetCtx.fill();
            } else if(type === 'drawPeach') {
                // 복숭아
                targetCtx.fillStyle = '#ff7675';
                targetCtx.beginPath(); targetCtx.arc(w/2-5, h/2, 12, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.arc(w/2+5, h/2, 12, 0, Math.PI*2); targetCtx.fill();
                targetCtx.beginPath(); targetCtx.moveTo(w/2, h/2-16); targetCtx.lineTo(w/2-10, h/2+8); targetCtx.lineTo(w/2+10, h/2+8); targetCtx.fill();
                targetCtx.fillStyle = '#27ae60';
                targetCtx.beginPath(); targetCtx.ellipse(w/2, h/2-14, 8, 3, Math.PI/4, 0, Math.PI*2); targetCtx.fill();
            }

            targetCtx.restore();
        }

        function renderStickerPalette() {
            const palette = document.getElementById('stickerPalette');
            palette.innerHTML = '';

            stickerDefs.forEach(s => {
                const item = document.createElement('div');
                item.className = 'sticker-item';
                item.onclick = () => addStickerToCanvas(s.type, s.name);

                const c = document.createElement('canvas');
                c.width = 50; c.height = 50;
                const cCtx = c.getContext('2d');
                drawIcon(s.type, cCtx, 50, 50);

                item.appendChild(c);
                const span = document.createElement('span');
                span.innerText = `${s.name}
(${s.meaning})`;
                item.appendChild(span);

                palette.appendChild(item);
            });
        }

        function changeBgColor() {
            canvasBgColor = document.getElementById('bgColorSelect').value;
            renderCanvas();
        }

        function addStickerToCanvas(type, name) {
            canvasElements.push({
                kind: 'sticker',
                type: type,
                name: name,
                x: 300 + (Math.random()*40 - 20),
                y: 350 + (Math.random()*40 - 20),
                size: 80
            });
            renderCanvas();
        }

        function addTextToCanvas() {
            const val = document.getElementById('canvasText').value;
            if(!val.trim()) return;
            canvasElements.push({
                kind: 'text',
                text: val,
                x: 300,
                y: 120,
                fontSize: 26
            });
            renderCanvas();
        }

        function recommendObjects() {
            const wish = document.getElementById('wishInput').value;
            if(!wish) {
                alert('소망을 입력해 보세요!');
                return;
            }

            let rec = [];
            if(wish.includes('시험') || wish.includes('공부') || wish.includes('성적') || wish.includes('책')) {
                rec = ['drawBook', 'drawCarp'];
                alert('💡 [학업 성취 & 출세] 소망에 어울리는 "책"과 "잉어"를 추천합니다!');
            } else if(wish.includes('건강') || wish.includes(' 오래') || wish.includes('아프지')) {
                rec = ['drawPine', 'drawPeach'];
                alert('💡 [장수 & 무병장수] 소망에 어울리는 "소망 소나무"와 "복숭아"를 추천합니다!');
            } else if(wish.includes('행복') || wish.includes('친구') || wish.includes('가족') || wish.includes('화목')) {
                rec = ['drawMagpie', 'drawPeony'];
                alert('💡 [기쁨 & 화목] 소망에 어울리는 "까치"와 "모란꽃"을 추천합니다!');
            } else {
                rec = ['drawTiger', 'drawSun'];
                alert('💡 [액운 퇴치 & 밝은 미래] 소망에 어울리는 "호랑이"와 "해"를 추천합니다!');
            }

            rec.forEach(rType => {
                const def = stickerDefs.find(s => s.type === rType);
                addStickerToCanvas(rType, def ? def.name : '사물');
            });
        }

        function clearCanvas() {
            canvasElements = [];
            renderCanvas();
        }

        function renderCanvas() {
            // 배경
            ctx.fillStyle = canvasBgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 전통 족자 문양 틀
            ctx.strokeStyle = '#7d1c1c';
            ctx.lineWidth = 6;
            ctx.strokeRect(15, 15, canvas.width-30, canvas.height-30);
            ctx.strokeStyle = '#d4a359';
            ctx.lineWidth = 2;
            ctx.strokeRect(22, 22, canvas.width-44, canvas.height-44);

            // 요소들 그리기
            canvasElements.forEach(el => {
                if(el.kind === 'sticker') {
                    ctx.save();
                    ctx.translate(el.x, el.y);
                    drawIcon(el.type, ctx, el.size, el.size);
                    ctx.restore();
                } else if(el.kind === 'text') {
                    ctx.save();
                    ctx.font = 'bold ' + el.fontSize + 'px "궁서", "Gungsuh", serif';
                    ctx.fillStyle = '#7d1c1c';
                    ctx.textAlign = 'center';
                    ctx.fillText(el.text, el.x, el.y);

                    // 낙관 도장 느낌 효과
                    ctx.fillStyle = '#c0392b';
                    ctx.fillRect(el.x + (el.text.length*10) + 10, el.y - 20, 22, 22);
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px sans-serif';
                    ctx.fillText('인', el.x + (el.text.length*10) + 21, el.y - 5);
                    ctx.restore();
                }
            });
        }

        // 캔버스 드래그 이동
        let isDragging = false;
        let selectedEl = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // 역순 검사 (위에 그려진 것 우선)
            for(let i = canvasElements.length - 1; i >= 0; i--) {
                const el = canvasElements[i];
                if(el.kind === 'sticker') {
                    if(mouseX >= el.x && mouseX <= el.x + el.size && mouseY >= el.y && mouseY <= el.y + el.size) {
                        isDragging = true;
                        selectedEl = el;
                        dragOffsetX = mouseX - el.x;
                        dragOffsetY = mouseY - el.y;
                        return;
                    }
                } else if(el.kind === 'text') {
                    if(Math.abs(mouseX - el.x) < 100 && Math.abs(mouseY - el.y) < 20) {
                        isDragging = true;
                        selectedEl = el;
                        dragOffsetX = mouseX - el.x;
                        dragOffsetY = mouseY - el.y;
                        return;
                    }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if(!isDragging || !selectedEl) return;
            const rect = canvas.getBoundingClientRect();
            selectedEl.x = (e.clientX - rect.left) - dragOffsetX;
            selectedEl.y = (e.clientY - rect.top) - dragOffsetY;
            renderCanvas();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            selectedEl = null;
        });

        function downloadCanvas() {
            const link = document.createElement('a');
            link.download = '나만의_소망_민화.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 초기화 호출
        window.onload = () => {
            initStudyTab();
            initStudioTab();
        };
    </script>
</body>
</html>
